<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d20">
<link rel="manifest" href="studio.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">

<title>استوديو الديوان</title>

<style>
:root{--g:#14602f;--g2:#0b3d20;--gold:#c79a2b;--gold2:#ecd48a;--cream:#faf5e8;--red:#b5232a;--ink:#12261a;--line:#e3dcc8;--card:#fff;--mut:#6b705f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:'Cairo',Tahoma,sans-serif;background:#efe9d6;color:var(--ink);overflow:hidden}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:linear-gradient(90deg,var(--g2),var(--g));color:#fff;border-bottom:3px solid var(--gold);flex-wrap:wrap}
header .logo{width:44px;height:44px;border-radius:50%;background:#fff;object-fit:cover;border:2px solid var(--gold)}
header h1{font-size:18px;margin:0;line-height:1.2}header small{display:block;font-size:11px;color:var(--gold2);font-weight:600}
.sp{flex:1}
.hb{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:12px;padding:8px 12px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.hb:hover{background:rgba(255,255,255,.24)}.hb:disabled{opacity:.4;cursor:default}
.hb.go{background:var(--gold);color:#2a1d00}
select.fmt{border:0;border-radius:12px;padding:8px 10px;font:inherit;font-weight:700;font-size:13px;background:#fff;color:var(--ink);max-width:170px}
.work{display:grid;grid-template-columns:1fr 380px;min-height:0}
.stage{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0}
.cwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px;background:repeating-conic-gradient(#e8e1cc 0 25%,#efe9d6 0 50%) 0 0/22px 22px}
#cv{box-shadow:0 8px 30px rgba(0,0,0,.28);background:#fff;touch-action:none;max-width:100%;max-height:100%}
.qbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px;background:#fff;border-top:1px solid var(--line);min-height:50px}
.qb{border:1px solid var(--line);background:var(--cream);border-radius:10px;padding:6px 10px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink)}
.qb:hover{background:#f1e9cf}.qb.on{background:var(--g);color:#fff;border-color:var(--g)}.qb:disabled{opacity:.35}
.side{background:#fff;border-inline-start:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:2px solid var(--line);overflow-x:auto}
.tab{flex:1 0 auto;padding:11px 12px;border:0;background:none;font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.on{color:var(--g);border-bottom-color:var(--gold)}
.pane{flex:1;overflow-y:auto;padding:14px;display:none}.pane.on{display:block}
h3{margin:14px 0 8px;font-size:14px;color:var(--g2)}h3:first-child{margin-top:0}
label.l{display:block;font-weight:700;font-size:12.5px;margin:10px 0 4px;color:#3b4733}
input[type=text],input[type=number],textarea,select{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:11px;font:inherit;font-size:14px;background:#fffdf7;color:var(--ink)}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--g)}
input[type=range]{width:100%;accent-color:var(--g)}
input[type=color]{width:38px;height:34px;padding:0;border:1.5px solid var(--line);border-radius:9px;background:#fff;cursor:pointer}
.r2{display:flex;gap:8px;align-items:center}.r2>*{flex:1}.r2>.f0{flex:0 0 auto}
.sw{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.sw i{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #c9c2aa;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border-radius:99px;background:#f3eedd;cursor:pointer;font-size:12.5px;font-weight:700;user-select:none;border:0;font-family:inherit;color:var(--ink)}
.chip.on{background:var(--g);color:#fff}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tc{cursor:pointer;text-align:center;font-size:11.5px;font-weight:700}
.tc canvas{width:100%;height:auto;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.2);border:2px solid transparent;display:block;margin-bottom:4px;background:#ddd}
.tc.on canvas,.tc:hover canvas{border-color:var(--gold)}
.agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ab{border:1.5px solid var(--line);background:var(--cream);border-radius:12px;padding:10px 4px;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px}
.ab:hover{border-color:var(--gold);background:#f6edcf}.ab svg{width:26px;height:26px;fill:var(--g)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;border-radius:13px;padding:11px;font:inherit;font-weight:800;font-size:14px;color:#fff;background:var(--g);cursor:pointer;margin-top:10px}
.btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.btn.gold{background:var(--gold);color:#2a1d00}
.btn.sm{width:auto;padding:7px 12px;font-size:12.5px;margin:0}
.hint{background:#fbf3d6;border:1px solid #ecd48a;border-radius:11px;padding:9px 11px;font-size:12.5px;line-height:1.7;color:#5b4a12;margin:8px 0}
.sug{border:1.5px solid var(--line);border-radius:14px;padding:11px;margin:10px 0;background:#fffdf7}
.sug b.t{display:block;font-size:12px;color:var(--gold);margin-bottom:4px}
.sug .tx{font-size:13.5px;line-height:1.8;white-space:pre-wrap}
.sug .bt{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.lay{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;margin-bottom:5px;background:#fffdf7;cursor:pointer;font-size:12.5px;font-weight:700}
.lay.on{border-color:var(--g);background:#eaf4ec}.lay span.n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lay button{border:0;background:none;cursor:pointer;font-size:14px;padding:2px 4px}
.modal{position:fixed;inset:0;background:rgba(10,30,18,.6);display:flex;align-items:center;justify-content:center;z-index:60;padding:14px}
.mbox{background:#fff;border-radius:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:20px;border-top:6px solid var(--gold)}
.mbox h2{margin:0 0 8px;font-size:20px;color:var(--g2)}
.hidden{display:none!important}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--g2);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;font-size:13.5px;z-index:70;box-shadow:0 6px 20px rgba(0,0,0,.3)}
footer{display:none}
.copy{padding:8px 14px;background:var(--g2);color:var(--gold2);font-size:12px;text-align:center;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center}
.copy a{color:#fff;display:inline-flex}
@media(max-width:860px){
 body{overflow:auto}
 .app{height:auto;min-height:100dvh;display:block}
 .work{display:flex;flex-direction:column}
 .cwrap{height:62vh;flex:none;padding:8px}
 .side{border-inline-start:0;border-top:2px solid var(--line);min-height:50vh}
 .agrid{grid-template-columns:repeat(4,1fr)}
}

</style>
</head>
<body>
<div class="app">
<header>
  <img class="logo" id="hLogo" alt="">
  <div><h1>استوديو الديوان</h1><small>تصميم المواد الإعلامية لقطاع الشباب والرياضة</small></div>
  <span class="sp"></span>
  <select class="fmt" id="fmt" aria-label="المقاس"></select>
  <button class="hb" id="undo" title="تراجع">↶</button><button class="hb" id="redo" title="إعادة">↷</button>
  <button class="hb" id="instBtn">📲 تثبيت</button>
  <button class="hb" id="guideBtn">❓ الدليل</button>
  <button class="hb go" id="expBtn">⬇ تصدير</button>
</header>
<div class="work">
  <div class="stage">
    <div class="cwrap" id="cw"><canvas id="cv"></canvas></div>
    <div class="qbar" id="qbar"></div>
  </div>
  <div class="side">
    <div class="tabs" id="tabs">
      <button class="tab on" data-p="pTpl">🎨 النماذج</button>
      <button class="tab" data-p="pAdd">➕ إضافة</button>
      <button class="tab" data-p="pProp">🎛 خصائص</button>
      <button class="tab" data-p="pBg">🖼 الخلفية</button>
      <button class="tab" data-p="pWr">✍️ مساعد الكتابة</button>
      <button class="tab" data-p="pLay">📚 الطبقات</button>
      <button class="tab" data-p="pBrand">🏷 هويتي</button>
    </div>
    <div class="pane on" id="pTpl"></div>
    <div class="pane" id="pAdd"></div>
    <div class="pane" id="pProp"></div>
    <div class="pane" id="pBg"></div>
    <div class="pane" id="pWr"></div>
    <div class="pane" id="pLay"></div>
    <div class="pane" id="pBrand"></div>
  </div>
</div>

</div>

  <label class="l">الصيغة</label><div class="chips" id="expType"></div>

  <button class="btn sec" id="expShare">📤 مشاركة</button>

  <button class="btn sec" id="expClose">إغلاق</button>
</div></div>

/* ---------- QR ---------- */
function qrEncode(text){
  const data=[...new TextEncoder().encode(text)];
  const ECC=[0,10,16,26,18,24,16,18,22,22,26],NB=[0,1,1,1,2,2,4,4,4,5,5];
  const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const a=Math.floor(v/7)+2;r-=(25*a-10)*a-55;if(v>=7)r-=36}return r};
  const capOf=v=>Math.floor(raw(v)/8)-ECC[v]*NB[v];
  let ver=1;for(;ver<=10;ver++){if(4+(ver<10?8:16)+data.length*8<=capOf(ver)*8)break}
  if(ver>10)throw new Error("QR text too long");
  const cap=capOf(ver),bits=[],put=(v,n)=>{for(let i=n-1;i>=0;i--)bits.push((v>>>i)&1)};
  put(4,4);put(data.length,ver<10?8:16);data.forEach(b=>put(b,8));put(0,Math.min(4,cap*8-bits.length));
  while(bits.length%8)bits.push(0);
  for(let p=0xEC;bits.length<cap*8;p^=0xEC^0x11)put(p,8);
  const cw=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=b<<1|bits[i+j];cw.push(b)}
  const ex=[],lg=[];let x=1;for(let i=0;i<255;i++){ex[i]=x;lg[x]=i;x<<=1;if(x&256)x^=0x11D}
  const mul=(a,b)=>a&&b?ex[(lg[a]+lg[b])%255]:0;
  const gen=d=>{let r=[1];for(let i=0;i<d;i++){const n=new Array(r.length+1).fill(0);for(let j=0;j<r.length;j++){n[j]^=r[j];n[j+1]^=mul(r[j],ex[i])}r=n}return r};
  const rs=(d,n)=>{const g=gen(n),res=new Array(n).fill(0);for(const b of d){const f=b^res.shift();res.push(0);for(let i=0;i<n;i++)res[i]^=mul(g[i+1],f)}return res};
  const nb=NB[ver],ecl=ECC[ver],tot=Math.floor(raw(ver)/8),ns=nb-tot%nb,sl=Math.floor(tot/nb),blocks=[];
  for(let i=0,k=0;i<nb;i++){const dl=sl-ecl+(i<ns?0:1),d=cw.slice(k,k+dl);k+=dl;blocks.push({d,e:rs(d,ecl)})}
  const out=[];for(let i=0;i<sl-ecl+1;i++)blocks.forEach(b=>{if(i<b.d.length)out.push(b.d[i])});
  for(let i=0;i<ecl;i++)blocks.forEach(b=>out.push(b.e[i]));
  const size=ver*4+17,m=Array.from({length:size},()=>new Array(size).fill(false)),fn=Array.from({length:size},()=>new Array(size).fill(false));
  const set=(x,y,v)=>{m[y][x]=v;fn[y][x]=true};
  for(let i=0;i<size;i++){set(6,i,i%2==0);set(i,6,i%2==0)}
  for(const [cx,cy] of [[3,3],[size-4,3],[3,size-4]])for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const xx=cx+dx,yy=cy+dy;if(xx>=0&&xx<size&&yy>=0&&yy<size){const d=Math.max(Math.abs(dx),Math.abs(dy));set(xx,yy,d!=2&&d!=4)}}
  if(ver>1){const na=Math.floor(ver/7)+2,step=Math.floor((ver*4+na*2+1)/(na*2-2))*2,pos=[6];for(let p=size-7;pos.length<na;p-=step)pos.splice(1,0,p);
    for(let i=0;i<na;i++)for(let j=0;j<na;j++){if((i==0&&j==0)||(i==0&&j==na-1)||(i==na-1&&j==0))continue;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(pos[i]+dx,pos[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!=1)}}
  const fmt=mask=>{const d=mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412,g=i=>((b>>>i)&1)==1;
    for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(let i=9;i<15;i++)set(14-i,8,g(i));
    for(let i=0;i<8;i++)set(size-1-i,8,g(i));for(let i=8;i<15;i++)set(8,size-15+i,g(i));set(8,size-8,true)};

async function makeFile(){const empty=D.objs.filter(o=>o.t==="img"&&!o.src&&!o.hide).length;if(empty&&!confirm(`يوجد ${empty} موضع صورة فارغ في التصميم. هل تريد المتابعة؟`))return null;

async function pdfOf(jb,w,h){const d=new Uint8Array(await jb.arrayBuffer()),enc=new TextEncoder(),parts=[],off=[];let len=0;const push=x=>{const b=typeof x==="string"?enc.encode(x):x;parts.push(b);len+=b.length};
  const pw=595,ph=Math.min(14400,Math.round(595*h/w*100)/100),cs=`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
  push("%PDF-1.4\n");off[1]=len;push("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");off[2]=len;push("2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n");
  off[3]=len;push(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>\nendobj\n`);
  off[4]=len;push(`4 0 obj\n<< /Length ${cs.length} >>\nstream\n${cs}\nendstream\nendobj\n`);
  off[5]=len;push(`5 0 obj\n<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${d.length} >>\nstream\n`);push(d);push("\nendstream\nendobj\n");
  const xr=len;push("xref\n0 6\n0000000000 65535 f \n");for(let i=1;i<6;i++)push(String(off[i]).padStart(10,"0")+" 00000 n \n");push(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);return new Blob(parts,{type:"application/pdf"})}
